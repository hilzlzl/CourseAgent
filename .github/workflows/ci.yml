name: Offline checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EDUCODER_TRACE_MODE: offline_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: pip install -r requirements.lock.txt
      - run: pip install --no-deps -e .
      - run: pip install 'faiss-cpu>=1.10,<2'
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap gcc g++ openjdk-21-jdk
      - name: Check public source boundary
        run: python scripts/audit_public.py
      - name: Require working isolation for execution tests
        run: python -m scripts.doctor --programming
      - name: Offline regressions
        run: python scripts/test_public.py
      - name: Export original fixed examples
        run: python -m scripts.demo
      - name: Check historical arithmetic
        run: python scripts/summarize_benchmark.py
      - name: Check 60-slot first pass, retries and incurred usage
        run: python scripts/summarize_extended_benchmark.py
      - name: Check existing three-request API comparison
        run: |
          python scripts/summarize_api_pilot.py
          python scripts/summarize_direct_api_comparison.py
      - name: Check three-group aggregate result format
        run: python scripts/summarize_server_benchmark.py
      - name: Real API and Worker process recovery with fixed input
        run: python -m scripts.evaluate_infrastructure
      - name: Build source and wheel distributions
        run: |
          pip install build
          python -m build
  browser-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:adapters
